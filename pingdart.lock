schema_version: 1

toolchain:
  minimum_cmake: "3.26.0"
  minimum_ninja: "1.11.0"
  cxx_standard: 20
  supported_compilers:
    - name: clang
      min_version: "16.0.0"
    - name: msvc
      min_version: "19.34.0"
    - name: apple_clang
      min_version: "15.0.0"

dependencies:
  - name: googletest
    version: "1.15.2"
    source:
      type: archive
      url: "https://github.com/google/googletest/archive/refs/tags/v1.15.2.tar.gz"
      sha256: "7b42b4d6ed48810c5362c265a17faebe90dc2373c885e5216439d37927f02926"
    license: BSD-3-Clause
    targets:
      - windows-x64
      - linux-x64
      - macos-arm64
    cache_filename: "googletest-v1.15.2.tar.gz"

  - name: harfbuzz
    version: "8.3.0"
    source:
      type: archive
      url: "https://github.com/harfbuzz/harfbuzz/archive/refs/tags/8.3.0.tar.gz"
      sha256: "109501089b3b44bde47537651a5118c7c25c6dbd9f36f87ea9372957973d8b9e"
    license: MIT
    targets:
      - windows-x64
      - linux-x64
      - macos-arm64
    cache_filename: "harfbuzz-8.3.0.tar.gz"

  - name: skia
    version: "m118-e3a1f8"
    source:
      type: archive
      url: "https://packages.pingdart.dev/deps/skia-m118-prebuilt.tar.gz"
      sha256: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
    license: BSD-3-Clause
    targets:
      - windows-x64
      - linux-x64
    cache_filename: "skia-m118-prebuilt.tar.gz"
