import com.android.build.api.artifact.SingleArtifact
import com.android.build.api.variant.BuildConfigField
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import javax.inject.Inject

plugins {
    alias(libs.plugins.android.application)
}

abstract class StagePingCoreAssets extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getPackageDirectories()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void stage() {
        def resourcePackage = packageDirectories.files.find { new File(it, "pingcore/resources.bin").isFile() }
        if (resourcePackage == null) {
            throw new GradleException("PingCore resource package is missing from the built Android ABIs")
        }
        fileSystemOperations.sync {
            from resourcePackage
            into outputDirectory
        }
    }
}

def pingcoreRoot = rootProject.projectDir.parentFile.parentFile
def pingcoreExample = providers.gradleProperty("pingcoreExample").orElse("ui_gallery").get()
def pingcoreApplicationActivationEnabled = pingcoreExample == "application"
def pingcoreExampleAndroid = new File(pingcoreRoot, "examples/${pingcoreExample}/android/src/main")
def pingcoreExampleManifest = new File(pingcoreExampleAndroid, "AndroidManifest.xml")
def pingcoreCompileSdk = providers.gradleProperty("pingcoreCompileSdk").map { it.toInteger() }.get()
def pingcoreMinSdk = providers.gradleProperty("pingcoreMinSdk").map { it.toInteger() }.get()
def pingcoreTargetSdk = providers.gradleProperty("pingcoreTargetSdk").map { it.toInteger() }.get()
def pingcoreNdkVersion = providers.gradleProperty("pingcoreNdkVersion").get()
def pingcoreAbis = providers.gradleProperty("pingcoreAbis").get().split(",")
def pingcoreStl = providers.gradleProperty("pingcoreStl").get()

android {
    buildFeatures {
        buildConfig = true
    }

    namespace = "org.pingcore.examples"
    compileSdk = pingcoreCompileSdk
    ndkVersion = pingcoreNdkVersion

    defaultConfig {
        applicationId = "org.pingcore.examples"
        minSdk = pingcoreMinSdk
        targetSdk = pingcoreTargetSdk
        versionCode = 1
        versionName = "1.0"
        manifestPlaceholders = [pingcoreApplicationActivationEnabled: pingcoreApplicationActivationEnabled]

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=${pingcoreStl}",
                        "-DPINGCORE_ROOT_DIR=${pingcoreRoot.absolutePath}",
                        "-DPINGCORE_EXAMPLE=${pingcoreExample}",
                        "-DPINGCORE_OPTIMIZATION=${providers.gradleProperty('pingcoreOptimization').orElse('default').get()}",
                        "-DPINGCORE_ENABLE_LTO=${providers.gradleProperty('pingcoreLto').orElse('OFF').get()}"
            }
        }

        ndk {
            abiFilters(*pingcoreAbis)
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            proguardFiles getDefaultProguardFile(
                    "proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }

    sourceSets {
        main {
            java.srcDir new File(pingcoreExampleAndroid, "java")
            res.srcDir new File(pingcoreExampleAndroid, "res")
        }
        debug {
            if (pingcoreExampleManifest.isFile()) {
                manifest.srcFile pingcoreExampleManifest
            }
        }
        release {
            if (pingcoreExampleManifest.isFile()) {
                manifest.srcFile pingcoreExampleManifest
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    // Cached CMake configurations must keep each example's metadata and resources separate.
    def integrationRoot = layout.buildDirectory.dir(
            "generated/pingcore/integration/${variant.name}/${pingcoreExample}").get().asFile
    variant.externalNativeBuild.arguments.add("-DPINGCORE_ANDROID_APP_INTEGRATION_ROOT=${integrationRoot.absolutePath}")
    def resourceRoot = layout.buildDirectory.dir(
            "generated/pingcore/resources/${variant.name}/${pingcoreExample}").get().asFile
    variant.externalNativeBuild.arguments.add("-DPINGCORE_ANDROID_RESOURCE_OUTPUT_ROOT=${resourceRoot.absolutePath}")
    def nativeLibraries = variant.artifacts.get(SingleArtifact.MERGED_NATIVE_LIBS.INSTANCE)
    def packagedAbis = nativeLibraries.map { directory ->
        new File(directory.asFile, "lib").listFiles()?.findAll { it.isDirectory() }?.sort { it.name } ?: []
    }
    def libraryFile = layout.buildDirectory.file("generated/pingcore/app-library/${variant.name}.txt").get().asFile
    def resolveLibrary = tasks.register("resolvePingCore${variant.name.capitalize()}AppLibrary") {
        // The public artifact carries the native build dependency and reflects device-only ABI builds.
        inputs.dir(nativeLibraries)
        inputs.dir(integrationRoot)
        outputs.file(libraryFile)
        doLast {
            def applications = packagedAbis.get().collect { abiDirectory ->
                def planFile = new File(integrationRoot, "${abiDirectory.name}/app.json")
                if (!planFile.isFile()) {
                    throw new GradleException("PingCore application integration plan is missing: ${planFile}")
                }
                def plan = new JsonSlurper().parse(planFile)
                if (plan.schema != 1 || !(plan.target instanceof String) || !(plan.artifact instanceof String)) {
                    throw new GradleException("PingCore application integration plan is invalid: ${planFile}")
                }
                def fileName = new File(plan.artifact).name
                if (!fileName.startsWith("lib") || !fileName.endsWith(".so") || fileName.length() <= 6) {
                    throw new GradleException("PingCore application artifact must be a lib<name>.so file: ${plan.artifact}")
                }
                def libraryName = fileName.substring(3, fileName.length() - 3)
                if (libraryName == "pingcore") {
                    throw new GradleException("PingCore application library must not use the framework name pingcore")
                }
                if (!new File(abiDirectory, fileName).isFile()) {
                    throw new GradleException("PingCore application library is missing for ${abiDirectory.name}: ${fileName}")
                }
                return [target: plan.target, library: libraryName]
            }.unique()
            if (applications.size() != 1) {
                throw new GradleException("PingCore application target and library name must match across Android ABIs")
            }
            libraryFile.parentFile.mkdirs()
            libraryFile.setText(applications[0].library, "UTF-8")
        }
    }
    // The task-backed provider carries the dependency into AGP's BuildConfig generation.
    variant.buildConfigFields.put("PINGCORE_APP_LIBRARY", resolveLibrary.map { task ->
        new BuildConfigField("String", JsonOutput.toJson(task.outputs.files.singleFile.getText("UTF-8")),
                "Application library resolved from the CMake target.")
    })

    def stageAssets = tasks.register("stagePingCore${variant.name.capitalize()}Assets", StagePingCoreAssets) {
        packageDirectories.from(packagedAbis.map { directories ->
            directories.collect { new File(resourceRoot, "${it.name}/package") }
        })
    }
    // Register ownership once so asset merging, lint, and other consumers all depend on staging.
    variant.sources.assets.addGeneratedSourceDirectory(stageAssets) { it.outputDirectory }
}

dependencies {
    implementation project(":PingCore")
}
