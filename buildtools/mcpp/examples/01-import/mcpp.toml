# c++23, and it is a workaround rather than a language requirement.
#
# The module unit writes `import std;`, which every implementation this project
# builds with supports at c++20 -- the MSVC STL's named modules are documented
# as needing /std:c++20 or later. But mcpp's clang-on-Windows path hardcodes
# `importStdMinLevel = 23` instead of probing the STL it found
# (mcpp-community/mcpp#603), and refuses the build below c++23.
#
# A module graph has exactly one standard, so this compiles pingcore at c++23
# too. Change this line back to c++20 once #603 is fixed.
[package]
name        = "pingcore-example-import"
version     = "0.1.0"
standard    = "c++23"
description = "The smallest PingCore application mcpp can build"

[dependencies]
pingcore = { path = "../../../.." }

[targets.pingcore_example_import]
kind = "bin"
main = "src/main.cpp"

# pingcore.rules owns the source selection: a build program can ADD a source but
# cannot replace one, so a package that also globbed src/**/*.cpp would link
# both the original and the hcg-transformed copy of every composable.
[build]
sources = []
